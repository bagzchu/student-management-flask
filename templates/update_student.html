{% extends 'base.html' %}

{% block title %}
  Add student
{% endblock title %}

{% block body %}
 <div class="container mt-3">
 <form action="/update_student/{{student.id}}"  method="post" enctype="multipart/form-data">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" value={{student.name}} required>
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control" id="email" name="email" value={{student.email}} placeholder="name@example.com" required>
  </div>
  <div class="mb-3">
    <label for="dob" class="form-label">Date of Birth</label>
    <input type="date" class="form-control" id="dob" name="dob" value={{student.dob}} required>
  </div>
  <div class="mb-3">
    <label for="gender" class="form-label">Gender</label>
    <select class="form-select" aria-label="Default select example" name="gender">
      <option selected>Select</option>
      <option value="Male" {% if student.gender=="Male" %}Selected{% endif %}>Male</option>
      <option value="Female" {% if student.gender=="Female" %}Selected{% endif %}>Female</option>
    </select>
  </div>
  <div class="mb-3">
    <label for="rollnumber" class="form-label">Roll Number</label>
    <input type="text" class="form-control" id="rollnumber" name="rollnumber" value={{student.roll_number}} required>
  </div>
  <div class="mb-3">
    <label for="admissiondate" class="form-label">Admission Date</label>
    <input type="date" class="form-control" id="admissiondate" name="admissiondate" value={{student.admission_date}} required>
  </div>
  <div class="mb-3">
    <label for="course" class="form-label">Course</label>
    <input type="text" class="form-control" id="course" name="course" value={{student.course}} required>
  </div>
  <div class="mb-3">
    <label for="photo" class="form-label">Profile Photo</label>
    <input type="file" class="form-control" id="photo" name="photo" accept="image/*" required>
    <small> Current Photo: {{student.photo}}</small>
  </div>
  <button type="submit" class="btn btn-primary">Update</button>
 </form>
  
 </div>
{% endblock body %}
